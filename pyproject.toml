[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "differential-privacy-dp-sgd"
version = "2.0.0"
description = "DP-Engine: RDP (Rényi Differential Privacy) Accountant & Gaussian Mechanism Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
differential-privacy-dp-sgd = "diff_privacy_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/differential-privacy-dp-sgd"
Repository = "https://github.com/abusuraihsakhri/differential-privacy-dp-sgd.git"
