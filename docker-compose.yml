version: '3.8'

services:
  differential-privacy-dp-sgd:
    build: .
    container_name: differential-privacy-dp-sgd
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=differential-privacy-dp-sgd-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
