name: Python validation

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Static syntax and dependency validation
        run: |
          python -m compileall -q agents diff_privacy_engine cli.py
          python -m pip check
      - name: Validate browser JavaScript syntax and static assets
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          for page in ("web/index.html", "docs/index.html"):
              source = pathlib.Path(page).read_text()
              scripts = re.findall(r'<script>(.*?)</script>', source, re.S | re.I)
              assert scripts, page
              with tempfile.NamedTemporaryFile(mode="w", suffix=".js") as test_script:
                  test_script.write("\n".join(scripts))
                  test_script.flush()
                  subprocess.run(["node", "--check", test_script.name], check=True)
          assert pathlib.Path("diff_privacy_engine/engine.py").exists()
          PY
      - name: Run tests
        run: python -m pytest -q
      - name: CLI and API smoke tests
        run: |
          python cli.py noise-scale --mechanism laplace --sensitivity 1 --epsilon 1
          python -m diff_privacy_engine.cli audit --task-id CI-SMOKE
          python -c "from agents.api import app; assert any(route.path == '/' for route in app.routes)"
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t dp-sgd-smoke .
      - name: Test HTTP entrypoint and console
        run: |
          docker run -d --name dp-sgd-smoke -p 127.0.0.1:8091:8000 dp-sgd-smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8091/ | grep -q "Operations Console"
          curl -fsS http://127.0.0.1:8091/metrics | grep -q "dossiers_processed_total"
          docker rm -f dp-sgd-smoke
