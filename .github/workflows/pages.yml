name: Deploy browser calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage browser app with authoritative Python engine
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp diff_privacy_engine/engine.py _site/engine.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and Python assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}/"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "${base}" -o /tmp/dp-pages-index.html \
              && curl -fsSL --max-time 20 "${base}engine.py" -o /tmp/dp-pages-engine.py \
              && grep -q "Differential Privacy &amp; DP-SGD" /tmp/dp-pages-index.html \
              && grep -q "class MomentsAccountant" /tmp/dp-pages-engine.py; then
              echo "Pages HTML and Python engine verified: ${base}"
              exit 0
            fi
            echo "Pages not ready (attempt ${attempt}/18)"
            sleep 5
          done
          echo "::error::Unable to verify the published calculator and engine"
          exit 1
      - name: Exercise Python calculations in a real browser
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["PAGE_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              errors = []
              page.on("pageerror", lambda exc: errors.append(str(exc)))
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_function(
                  "() => document.querySelector('#runtime').textContent.includes('Python ready')",
                  timeout=120000
              )

              def calculate():
                  page.locator("#calculate").click()
                  page.wait_for_function(
                      "() => { try { return JSON.parse(document.querySelector('#result').textContent) !== null; } catch { return false; } }",
                      timeout=30000
                  )
                  return json.loads(page.locator("#result").inner_text())

              result = calculate()
              assert "noisy_value" in result and "true_value" not in result, result

              page.locator("#mode").select_option("composition")
              result = calculate()
              assert "epsilon_total" in result and "delta_total" in result, result

              page.locator("#mode").select_option("gradient")
              result = calculate()
              assert len(result["private_average_gradient"]) == 2, result

              page.locator("#mode").select_option("accountant")
              result = calculate()
              assert result["epsilon_upper_bound"] > 0, result

              assert not errors, errors
              browser.close()
          print("Browser Python runtime and all four calculator modes passed")
          PY
