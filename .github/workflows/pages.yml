name: Deploy browser calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage browser app with authoritative Python engine
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp diff_privacy_engine/engine.py _site/engine.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and Python assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}/"
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "${base}" -o /tmp/dp-pages-index.html \
              && curl -fsSL --max-time 20 "${base}engine.py" -o /tmp/dp-pages-engine.py \
              && grep -q "Differential Privacy &amp; DP-SGD" /tmp/dp-pages-index.html \
              && grep -q "class MomentsAccountant" /tmp/dp-pages-engine.py; then
              echo "Pages HTML and Python engine verified: ${base}"
              exit 0
            fi
            echo "Pages not ready (attempt ${attempt}/18)"
            sleep 5
          done
          echo "::error::Unable to verify the published calculator and engine"
          exit 1
